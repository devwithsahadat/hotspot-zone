<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login – Hotspot Zone</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
    :root {
      --bg:#0f172a; --surface:#1e293b; --card:#263148;
      --accent:#38bdf8; --accent2:#818cf8; --danger:#f87171;
      --text:#e2e8f0; --muted:#94a3b8; --border:#334155;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2rem 2.25rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }
    .logo { text-align:center; margin-bottom:1.8rem; }
    .logo .icon { font-size:2.5rem; }
    .logo h1 {
      font-size:1.3rem; font-weight:700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    label { display:block; font-size:.82rem; color:var(--muted); margin:.9rem 0 .3rem;
            text-transform:uppercase; letter-spacing:.05em; }
    input {
      width:100%; background:var(--card); border:1px solid var(--border);
      border-radius:8px; color:var(--text); padding:.65rem .85rem;
      font-size:.95rem; outline:none; transition:border-color .2s;
    }
    input:focus { border-color:var(--accent); }
    .btn {
      display:block; width:100%; padding:.8rem; border:none;
      border-radius:10px; font-size:1rem; font-weight:700;
      cursor:pointer; margin-top:1.4rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color:#fff; transition:opacity .2s;
    }
    .btn:hover { opacity:.9; }
    .flash { padding:.65rem 1rem; border-radius:8px; margin-bottom:1rem;
              font-size:.88rem; background:rgba(248,113,113,.12);
              border:1px solid var(--danger); color:var(--danger); }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="icon">🔒</div>
    <h1>Admin Login</h1>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  <form action="/admin/login" method="POST">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" placeholder="admin" required autofocus />
    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="••••••••" required />
    <button type="submit" class="btn">Login →</button>
  </form>
</div>
</body>
</html>
